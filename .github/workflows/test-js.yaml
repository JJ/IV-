name: "Testea código JS"
on:
  push:
    paths:
      - "**/*.js"
      - "**/*.*js"
      - "test/**"
      - .github/workflows/test-js.yaml
      - package.json
      - package-lock.json

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'node'

      - name: Install and test
        run: npm ci && npm test
